name: Build and release

# Pushing a tag like v0.3.0 builds the Windows .exe and publishes a GitHub Release.
# "Run workflow" on the Actions tab builds a test copy without releasing it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File -Exclude "SHA256SUMS.txt" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt -Encoding utf8NoBOM


      - name: Package
        shell: pwsh
        run: |
           New-Item -ItemType Directory -Force dist | Out-Null
            Copy-Item target/release/nazo-english-patcher.exe dist/NazoMakaimura-English-Patcher.exe
            Copy-Item assets/patch.ppf "dist/NazoMakaimura-English-${{ github.ref_name }}.ppf"
            Get-ChildItem dist -File -Exclude "SHA256SUMS.txt" |
              Get-FileHash -Algorithm SHA256 |
              ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
              Out-File dist/SHA256SUMS.txt -Encoding ascii

      - name: Smoke test the .exe
        shell: pwsh
        run: |
          # GUI-subsystem exe: PowerShell won't wait unless asked to
          $p = Start-Process -FilePath ./dist/NazoMakaimura-English-Patcher.exe `
                 -ArgumentList '--write-music','music-test.wav' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0 -or -not (Test-Path music-test.wav)) { throw "exe did not run correctly" }

      - uses: actions/upload-artifact@v4
        with:
          name: NazoMakaimura-English-Patcher-windows
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: English Patch ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: dist/*
