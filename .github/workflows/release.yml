name: Build and release

# Pushing a tag like v0.3.0 builds the Windows .exe and publishes a GitHub Release.
# "Run workflow" on the Actions tab builds a test copy without releasing it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          # Find the built .exe automatically (handles hyphens vs underscores in Cargo.toml)
          $exe = Get-ChildItem target/release/*.exe | Select-Object -First 1
          if (-not $exe) {
            throw "No .exe found in target/release/. Check that src/main.rs or [[bin]] exists in Cargo.toml."
          }

          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev-${{ github.run_number }}" }

          Copy-Item $exe.FullName dist/NazoMakaimura-English-Patcher.exe
          Copy-Item assets/patch.ppf "dist/NazoMakaimura-English-$ver.ppf"

          Get-ChildItem dist -File -Exclude "SHA256SUMS.txt" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Smoke test the .exe
        shell: pwsh
        run: |
          # GUI-subsystem exe: PowerShell won't wait unless asked to
          $p = Start-Process -FilePath ./dist/NazoMakaimura-English-Patcher.exe `
                 -ArgumentList '--write-music','music-test.wav' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0 -or -not (Test-Path music-test.wav)) { throw "exe did not run correctly" }

      - uses: actions/upload-artifact@v4
        with:
          name: NazoMakaimura-English-Patcher-windows
          path: dist/*

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: English Patch ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          generate_release_notes: true
          files: dist/*
